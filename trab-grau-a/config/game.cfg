# Voo Rasante -- configuracao do jogo
#
# Formato: chave = valor, uma por linha. Tudo depois de # e comentario.
# Qualquer chave pode ser removida: o jogo usa o padrao de src/core/config.h.
# Editar este arquivo e rodar de novo muda o jogo SEM recompilar.

# ---- janela ----
window_width  = 800
window_height = 600

# ---- mundo ----
# O mapa e QUADRADO de proposito: o radar tambem e quadrado, e um mundo 4:3
# dentro de um painel 1:1 distorceria o mapa ou deixaria borda sobrando.
# 96 tiles x 32 unidades = mundo de 3072 x 3072 unidades.
map_tiles    = 96
tile_size    = 32
border_tiles = 2
seed         = 20262

# ---- voo do jogador ----
# O aviao nunca para: a velocidade so varia entre speed_min e speed_max.
speed_min     = 90
speed_max     = 320
speed_start   = 160
accel         = 170
turn_rate     = 2.4
player_health = 5

# ---- metralhadora (municao infinita) ----
bullet_speed  = 620
bullet_life   = 1.1
gun_cooldown  = 0.09
bullet_damage = 1

# ---- bombas (estoque limitado) ----
bomb_count     = 20
bomb_fall_time = 0.75
bomb_radius    = 90
explosion_time = 0.35

# ---- inimigos ----
enemy_count         = 10
enemy_health        = 3
enemy_fire_cooldown = 2.2
enemy_bullet_speed  = 220
enemy_range         = 420
turret_turn_rate    = 1.6

score_per_tank = 100

# ---- radar ----
radar_size   = 160
radar_margin = 12

# ---- parallax ----
# Fator de rolagem de cada camada em relacao a camera.
# O chao e a camada mais distante e rola a 1.0. As nuvens ficam entre a camera
# e o chao, entao rolam mais rapido: quanto mais alta a nuvem, maior o fator.
parallax_clouds_low  = 1.15
parallax_clouds_high = 1.60
cloud_count          = 60
